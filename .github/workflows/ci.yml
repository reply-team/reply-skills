name: CI

on:
  pull_request:
  workflow_dispatch:

# Note: installing the packs through a real host (`claude plugin install`) is not run here —
# it needs the host CLI on the runner. It is verified manually before a release, and the
# pure-Node `smoke` step below covers the property that actually breaks: whether a pack still
# works when it is the only thing installed.

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Skill contract & pack architecture
        run: npm run validate

      - name: Generated manifests are current
        run: npm run check-manifests

      - name: Generated catalogs are current
        run: npm run check-index

      - name: Packs install cleanly, per-pack and flattened
        run: npm run smoke
