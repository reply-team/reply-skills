name: CI

on:
  pull_request:
  workflow_dispatch:

# Note: installing the packs through a real host (`claude plugin install`) is not run here —
# it needs the host CLI on the runner. It is verified manually before a release, and the
# pure-Node `smoke` step below covers the property that actually breaks: whether a pack still
# works when it is the only thing installed.

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # One step, deliberately: `check` is the whole gate, and it is the same command a
      # contributor runs locally before pushing. Listing the individual steps here meant CI
      # and package.json could disagree about what "checked" means — and they did. Two checks
      # (operation-name resolution in prose, and generated-table freshness) existed in `check`
      # for a whole branch without CI ever running one of them, while the branch's own
      # documentation said CI enforced both. Whatever `check` grows next is enforced here the
      # day it lands, without a second edit anybody has to remember.
      - name: Full gate — contract, manifests, generated tables, operation names, smoke install
        run: npm run check
